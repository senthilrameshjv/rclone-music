<h1>rclone-music</h1>
<p>rclone-music is a personal, single-user tool. It uses <a href="https://rclone.org">rclone</a> to keep a copy of the
owner's own music collection in the owner's own Google Drive, mirroring a local SD card.</p>
<p>It is not a public service. It is not offered to other users, and no one else can sign in to it.</p>
<p><a href="privacy.html">Privacy policy</a></p>
